<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Conversion Calculator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Currency Conversion Calculator</h1>
    <div class="conversion">
      <div class="inputs">
        <label for="input-currency">From:</label>
        <select id="input-currency" name="input-currency" required></select>
      </div>
      <div class="inputs">
        <label for="input-amount">Amount:</label>
        <input type="number" id="input-amount" name="input-amount" />
      </div>
      <div class="inputs">
        <label for="output-currency">To:</label>
        <select id="output-currency" name="output-currency" required></select>
      </div>
      <div class="inputs">
        <label for="output-amount">Amount:</label>
        <input type="number" id="output-amount" name="output-amount" />
      </div>
    </div>
  </body>

  <script src="script.js" type="module"></script>
</html>
